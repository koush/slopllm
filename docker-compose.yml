# slopllm OpenAI server on koush/slopllm (see Dockerfile).
#
# Mirrors the GPU passthrough pattern from ~/chat/vllm/docker-compose.yml:
# `gpus: all` plus host networking/IPC, which are what work on this system.
#
#   docker compose up -d --wait
#   docker compose logs -f
#   docker compose down
#
# The image must be built first: `docker compose build`. Because BuildKit
# caches the repo clone by its arguments, pick up new commits with
#   REPO_REF=$(git rev-parse origin/main) docker compose build
# The server binds host port ${PORT:-8000} directly (host networking).
#
# Overrides (environment or a .env file next to this file):
#   IMAGE, CONTAINER_NAME, PORT, GPUS (GPU order for tensor/context
#   parallelism), MAX_PAGES, HF_HOME (host Hugging Face cache;
#   defaults to the standard ~/.cache/huggingface), NCCL_P2P_LEVEL
#   (defaults to SYS, the known-good setting for this host's dual-switch
#   interconnect), NCCL_TOPO_FILE (optional pass-through from the compose
#   shell or .env; unset lets NCCL auto-detect; host files go in
#   ./docker-mnt, mounted at /docker-mnt), DOCKER_MNT (host directory
#   to mount at /docker-mnt).
#
# Model load takes several minutes (~90GB of weights across 8 GPUs);
# the health check has a long start period to match.

services:
  slopllm:
    build:
      context: .
      args:
        # REPO_REF may be a branch name or a commit SHA. BuildKit caches the
        # clone layer by its arguments, so pass the current remote SHA to
        # pick up new commits: REPO_REF=$(git rev-parse origin/main)
        # docker compose build
        REPO_REF: "${REPO_REF:-main}"
    image: "${IMAGE:-koush/slopllm}"
    container_name: "${CONTAINER_NAME:-slopllm}"
    command:
      - node
      - --require
      - tsx/cjs
      - src/openai-server.ts
      - --arena
      - "92"
      - --host
      - "${HOST:-127.0.0.1}"
      - --port
      - "${PORT:-8000}"
      # Shared model arguments (same parser as run_model_loader executors).
      - --mtp
      - --cp
      - --gpus
      - "${GPUS:-0,1,2,3,4,5,6,7}"
      - --max-pages
      - "${MAX_PAGES:-8192}"
    network_mode: host
    # ipc: host shares the host's /dev/shm outright (shm_size is ignored
    # with host IPC); NCCL staging buffers need a large host /dev/shm.
    ipc: host
    # Bound retries: a boot crash (e.g. missing HF cache) otherwise loops
    # a multi-minute ~90GB weight reload forever. Clean exits (docker stop,
    # reboot) are not restarted — run `docker compose up -d` after a reboot.
    restart: on-failure:3
    init: true
    gpus: all
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    stop_grace_period: 2m
    environment:
      # HF_HOME is intentionally not set: the app resolves the standard
      # unspecified default (~/.cache/huggingface, i.e. /root/.cache/huggingface
      # in this image) exactly like the Hugging Face convention, and the
      # volume below puts the host cache at that path.
      # NCCL_P2P_LEVEL defaults to SYS: on this host NCCL misreads the
      # dual-switch interconnect and falls back to host-staged collectives.
      # NCCL_TOPO_FILE is a pass-through (null value): set it in the shell
      # or a .env file to use a topology override, e.g.
      # NCCL_TOPO_FILE=/docker-mnt/topo_fixed.xml with the host file at
      # ./docker-mnt/topo_fixed.xml. Unset, the variable is truly absent
      # from the container and NCCL auto-detects.
      NCCL_P2P_LEVEL: "${NCCL_P2P_LEVEL:-SYS}"
      NCCL_TOPO_FILE:
    volumes:
      # Host Hugging Face cache (default: ~/.cache/huggingface) mounted at the
      # container's own default location. Models must live under
      # <cache>/hub/models--<org>--<name>/snapshots/<rev>.
      - "${HF_HOME:-${HOME:-/root}/.cache/huggingface}:/root/.cache/huggingface:ro"
      # Host-specific runtime files (e.g. NCCL topology), read-only at
      # /docker-mnt. The directory ships in the repo with a .gitignore;
      # its contents are not checked in.
      - "${DOCKER_MNT:-./docker-mnt}:/docker-mnt:ro"
    # The runtime image has no curl; use node's fetch for the health probe.
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:${PORT:-8000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20m